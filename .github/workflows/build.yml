name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK (con reintentos)
        run: |
          for i in 1 2 3; do
            gradle assembleDebug --no-daemon && exit 0
            echo "Intento $i fallido; reintentando en 60 s..."
            sleep 60
          done
          exit 1
      - name: Publish release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AdBlockFilm.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AdBlockFilm.apk --title "AdBlock Film" --notes "APK generado automáticamente" --target "${{ github.sha }}"
